    <!-- Razorpay Standard Checkout SDK (deferred to prevent blocking DOM on mobile) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    <!-- Google Identity Services SDK for Direct Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          localStorage.setItem('nexusverse_reg_closed', 'false');
          var t = localStorage.getItem('nexusverse_theme');
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            t = 'light';
          }
          if (t === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        var h = window.location.hash || '';
        var s = window.location.search || '';
        if (h.includes('access_token=') || s.includes('code=')) {
          if (window.opener && window.opener !== window) {
            try {
              window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', hash: h, search: s }, '*');
            } catch(e) {}
            window.close();
          }
        }
      })();
    </script>
    <script>
      // Manage Service Worker: ONLY for web browsers, NEVER inside native Android/Capacitor WebView
      (function() {
        var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if ('serviceWorker' in navigator) {
          if (isNative) {
            // Unregister any active Service Worker that might intercept and block local APK assets
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          } else {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                  console.log('⚡ [NexusVerse Cache Memory]: Service Worker active at', reg.scope);
                })
                .catch(function(err) {
                  console.warn('⚡ [NexusVerse Cache Memory]: Service worker notice:', err);
                });
            });
          }
        }
      })();
    </script>
  </head>
